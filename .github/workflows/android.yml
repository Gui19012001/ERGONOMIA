name: Build NR17 Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      # ==========================================================
      # REPOSITÓRIO
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # PYTHON DO HOST
      # ==========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================================
      # JAVA
      # ==========================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # DEPENDÊNCIAS LINUX
      # ==========================================================
      - name: Install Linux dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            ant \
            autoconf \
            automake \
            ccache \
            cmake \
            g++ \
            gcc \
            gettext \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            libtinfo6 \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3-dev \
            python3-pip \
            python3-venv \
            unzip \
            wget \
            zip \
            zlib1g-dev

      # ==========================================================
      # BUILDOZER
      # ==========================================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip wheel

          python -m pip install \
            setuptools \
            cython==0.29.34 \
            buildozer

      # ==========================================================
      # CONFIGURAÇÃO DO TABLET
      #
      # CAMERA_PREVIEW_ROTATION=0
      #   Camera já está correta em LANDSCAPE.
      #
      # POSE_ROTATION=270
      #   Corrige a orientação do frame enviado ao ML Kit.
      # ==========================================================
      - name: Criar configuracao tablet
        run: |
          cat > teste.env <<'EOF'
          CAMERA_TRASEIRA_INDEX=0

          CAMERA_PREVIEW_ROTATION=0
          POSE_ROTATION=270

          CAMERA_WIDTH=1280
          CAMERA_HEIGHT=720

          POSE_INPUT_LONG_SIDE=640
          POSE_INTERVAL=0.12
          POSE_MIN_CONFIDENCE=0.45

          IRE_TRONCO=25
          IRE_PESCOCO=25
          IRE_BRACO=60
          IRE_JOELHO=130
          EOF

      # ==========================================================
      # CONFERIR CONFIGURAÇÃO
      # ==========================================================
      - name: Conferir configuracao tablet
        run: |
          echo "========================================"
          echo "CONFIGURACAO DO TABLET"
          echo "========================================"

          cat teste.env

          echo "========================================"
          echo "ROTACAO"
          echo "========================================"
          echo "Preview da camera : 0 graus"
          echo "Pose ML Kit       : 270 graus"
          echo "========================================"

      # ==========================================================
      # LIMPEZA DO BUILD DO PROJETO
      #
      # Não apagamos ~/.buildozer aqui.
      # O próprio runner é descartável e isso evita eliminar
      # downloads válidos feitos durante a preparação.
      # ==========================================================
      - name: Limpar build anterior
        run: |
          rm -rf .buildozer
          rm -rf bin

      # ==========================================================
      # CONFERÊNCIA
      # ==========================================================
      - name: Conferir ambiente de build
        run: |
          echo "========================================"
          echo "HOST PYTHON"
          echo "========================================"
          python --version

          echo ""
          echo "========================================"
          echo "JAVA"
          echo "========================================"
          java -version

          echo ""
          echo "========================================"
          echo "P4A CONFIGURADO"
          echo "========================================"
          grep "^p4a.branch" buildozer.spec || true

          echo ""
          echo "========================================"
          echo "REQUIREMENTS"
          echo "========================================"
          grep "^requirements" buildozer.spec || true

          echo ""
          echo "========================================"
          echo "ANDROID API"
          echo "========================================"
          grep "^android.api" buildozer.spec || true

          echo ""
          echo "========================================"
          echo "ANDROID MIN API"
          echo "========================================"
          grep "^android.minapi" buildozer.spec || true

          echo ""
          echo "========================================"
          echo "ANDROID NDK"
          echo "========================================"
          grep "^android.ndk" buildozer.spec || true

          echo ""
          echo "========================================"
          echo "ML KIT"
          echo "========================================"
          grep "^android.gradle_dependencies" buildozer.spec || true

          echo ""
          echo "========================================"

      # ==========================================================
      # BUILD APK
      #
      # IMPORTANTE:
      # O servidor principal do FreeType retornou HTTP 502.
      #
      # O p4a v2024.01.21 usa FreeType 2.10.1 e permite
      # sobrescrever a URL através de URL_freetype.
      # ==========================================================
      - name: Build APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

          # Mirror Savannah para evitar:
          # download.savannah.gnu.org -> HTTP 502
          URL_freetype: "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz"

        run: |
          echo "========================================"
          echo "INICIANDO BUILD ANDROID"
          echo "========================================"

          echo ""
          echo "FREETYPE MIRROR:"
          echo "$URL_freetype"

          echo ""
          echo "========================================"

          buildozer -v android debug

      # ==========================================================
      # VERIFICAR APK
      # ==========================================================
      - name: Conferir APK gerado
        run: |
          echo "========================================"
          echo "APK GERADO"
          echo "========================================"

          find bin -maxdepth 1 -type f -name "*.apk" -print

          APK_COUNT=$(find bin -maxdepth 1 -type f -name "*.apk" | wc -l)

          echo ""
          echo "Total de APKs encontrados: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "ERRO: Nenhum APK foi encontrado."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "BUILD FINALIZADO COM SUCESSO"
          echo "========================================"

      # ==========================================================
      # UPLOAD DO APK
      # ==========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nr17-visao-apk
          path: bin/*.apk
          if-no-files-found: error
