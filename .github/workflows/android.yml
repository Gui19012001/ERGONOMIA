name: Build NR17 Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      # ==========================================================
      # REPOSITÓRIO
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # PYTHON DO HOST
      # ==========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================================
      # JAVA
      # ==========================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # DEPENDÊNCIAS LINUX
      # ==========================================================
      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            ant \
            autoconf \
            automake \
            ccache \
            cmake \
            g++ \
            gcc \
            gettext \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            libtinfo6 \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3-dev \
            python3-pip \
            python3-venv \
            unzip \
            wget \
            zip \
            zlib1g-dev

      # ==========================================================
      # BUILDOZER
      # ==========================================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install \
            setuptools \
            cython==0.29.34 \
            buildozer

      # ==========================================================
      # CONFIGURAÇÃO DO TABLET
      #
      # CAMERA:
      # O preview já está correto em landscape.
      #
      # POSE:
      # O frame bruto precisa ser compensado em 270 graus
      # antes da interpretação do ML Kit.
      # ==========================================================
      - name: Criar configuracao tablet
        run: |
          cat > teste.env <<'EOF'
          CAMERA_TRASEIRA_INDEX=0

          CAMERA_PREVIEW_ROTATION=0
          POSE_ROTATION=270

          CAMERA_WIDTH=1280
          CAMERA_HEIGHT=720

          POSE_INPUT_LONG_SIDE=640
          POSE_INTERVAL=0.12
          POSE_MIN_CONFIDENCE=0.45

          IRE_TRONCO=25
          IRE_PESCOCO=25
          IRE_BRACO=60
          IRE_JOELHO=130
          EOF

      # ==========================================================
      # MOSTRAR CONFIGURAÇÃO
      # ==========================================================
      - name: Conferir configuracao tablet
        run: |
          echo "========================================"
          echo "CONFIGURACAO DO TABLET"
          echo "========================================"
          cat teste.env
          echo "========================================"

          echo ""
          echo "ROTACAO ESPERADA"
          echo "Preview da camera: 0 graus"
          echo "Pose ML Kit:       270 graus"
          echo ""

      # ==========================================================
      # LIMPEZA TOTAL
      #
      # Evita reutilizar builds antigos com:
      # - Python Android antigo
      # - configuracao antiga de rotacao
      # - caches anteriores
      # ==========================================================
      - name: Limpar completamente build anterior
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -rf ~/.buildozer
          rm -rf ~/.cache/pip

      # ==========================================================
      # CONFERÊNCIA DO BUILDOZER
      # ==========================================================
      - name: Conferir buildozer
        run: |
          echo "========================================"
          echo "HOST PYTHON"
          python --version

          echo "========================================"
          echo "JAVA"
          java -version

          echo "========================================"
          echo "P4A CONFIGURADO"
          grep "^p4a.branch" buildozer.spec

          echo "========================================"
          echo "REQUIREMENTS"
          grep "^requirements" buildozer.spec

          echo "========================================"
          echo "ANDROID API / MIN API / NDK"
          grep "^android.api" buildozer.spec || true
          grep "^android.minapi" buildozer.spec || true
          grep "^android.ndk" buildozer.spec || true

          echo "========================================"
          echo "ML KIT"
          grep "^android.gradle_dependencies" buildozer.spec || true

          echo "========================================"

      # ==========================================================
      # BUILD APK
      # ==========================================================
      - name: Build APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          buildozer -v android debug

      # ==========================================================
      # LOCALIZAR APK
      # ==========================================================
      - name: Conferir APK gerado
        run: |
          echo "========================================"
          echo "APK GERADO"
          echo "========================================"

          find bin -maxdepth 1 -type f -name "*.apk" -print

          echo "========================================"

          APK_COUNT=$(find bin -maxdepth 1 -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERRO: Nenhum APK encontrado."
            exit 1
          fi

          echo "Total de APKs encontrados: $APK_COUNT"

      # ==========================================================
      # ARTIFACT
      # ==========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nr17-visao-apk
          path: bin/*.apk
          if-no-files-found: error
