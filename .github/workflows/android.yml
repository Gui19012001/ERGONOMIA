name: Build NR17 Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      # ==========================================================
      # REPOSITÓRIO
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # PYTHON DO HOST
      # ==========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================================
      # JAVA
      # ==========================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # DEPENDÊNCIAS LINUX
      # ==========================================================
      - name: Install Linux dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            ant \
            autoconf \
            automake \
            ccache \
            cmake \
            g++ \
            gcc \
            gettext \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            libtinfo6 \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3-dev \
            python3-pip \
            python3-venv \
            unzip \
            wget \
            zip \
            zlib1g-dev

      # ==========================================================
      # BUILDOZER
      # ==========================================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip wheel

          python -m pip install \
            setuptools \
            cython==0.29.34 \
            buildozer

      # ==========================================================
      # CONFIGURAÇÃO PADRÃO DO TABLET
      #
      # IMPORTANTE:
      # Estes valores são apenas o padrão do primeiro uso.
      # No APK 0.1.16 o usuário pode alterar rotação e espelhamento
      # em ⚙ CÂMERA e salvar localmente no tablet.
      # Não é mais necessário recompilar o APK para calibrar.
      # ==========================================================
      - name: Criar configuracao tablet
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERRO: crie o Repository Secret GEMINI_API_KEY antes do build."
            exit 1
          fi

          if [ -z "$GROQ_API_KEY" ]; then
            echo "ERRO: crie o Repository Secret GROQ_API_KEY antes do build."
            exit 1
          fi

          cat > teste.env <<ENVEOF
          CAMERA_TRASEIRA_INDEX=0

          CAMERA_PREVIEW_ROTATION=0
          POSE_ROTATION=270
          CAMERA_PREVIEW_MIRROR_X=1
          CAMERA_PREVIEW_MIRROR_Y=0

          CAMERA_WIDTH=1280
          CAMERA_HEIGHT=720
          CAMERA_RESTART_DELAY=0.65

          POSE_INPUT_LONG_SIDE=640
          POSE_INTERVAL=0.12
          POSE_MIN_CONFIDENCE=0.45
          ANGLE_MIN_CONFIDENCE=0.60
          LANDMARK_CONFIRM_FRAMES=2
          LANDMARK_JUMP_LIMIT=0.18
          LANDMARK_SMOOTH_ALPHA=0.65

          # Rastreamento corporal por toque
          BODY_TARGET_MAX_DISTANCE=0.32
          BODY_TARGET_TRACK_ALPHA=0.22
          BODY_TARGET_MIN_BODY_PCT=75

          # Evidencia automatica: guarda somente a mais critica por fator
          AUTO_EVIDENCE_HOLD_S=0.80
          AUTO_EVIDENCE_COOLDOWN_S=2.00
          AUTO_EVIDENCE_MIN_QUALITY=60
          AUTO_EVIDENCE_MIN_COVERAGE=55
          AUTO_EVIDENCE_DELTA_TRUNK=2.0
          AUTO_EVIDENCE_DELTA_NECK=2.0
          AUTO_EVIDENCE_DELTA_ARM=3.0
          AUTO_EVIDENCE_DELTA_KNEE=3.0

          # Servico de interpretacao multimodal - chave vem do GitHub Secret
          GEMINI_API_KEY=$GEMINI_API_KEY
          GEMINI_MODEL=gemini-2.5-flash-lite
          GEMINI_SECOND_MODEL=gemini-3.1-flash-lite
          GEMINI_FALLBACK_MODEL=gemini-2.5-flash
          GEMINI_TIMEOUT=90
          GEMINI_IMAGE_LONG_SIDE=768
          GEMINI_IMAGE_QUALITY=72
          GEMINI_MAX_IMAGES=4

          # Rota independente de contingencia - Groq SOMENTE DADOS
          # Nenhuma imagem/evidencia e enviada para a Groq.
          GROQ_API_KEY=$GROQ_API_KEY
          GROQ_MODEL=qwen/qwen3.6-27b
          GROQ_TIMEOUT=75
          GROQ_MAX_OUTPUT_TOKENS=1400

          IRE_TRONCO=25
          IRE_PESCOCO=25
          IRE_BRACO=60
          IRE_JOELHO=130
          ENVEOF

      # ==========================================================
      # CONFERIR CONFIGURAÇÃO
      # ==========================================================
      - name: Conferir configuracao tablet
        run: |
          echo "========================================"
          echo "CONFIGURACAO PADRAO DO TABLET"
          echo "========================================"
          grep -v -E '^(GEMINI_API_KEY|GROQ_API_KEY)=' teste.env
          echo "GEMINI_API_KEY=***CONFIGURADA VIA SECRET***"
          echo "GROQ_API_KEY=***CONFIGURADA VIA SECRET***"
          echo "========================================"
          echo "No APK: calibracao da camera e salva automaticamente"
          echo "Relatorio: 3 rotas Gemini visuais -> Groq somente dados quantitativos -> PDF tecnico"
          echo "========================================"

      # ==========================================================
      # LIMPEZA DO BUILD DO PROJETO
      # ==========================================================
      - name: Limpar build anterior
        run: |
          rm -rf .buildozer
          rm -rf bin

      # ==========================================================
      # CONFERÊNCIA
      # ==========================================================
      - name: Conferir ambiente de build
        run: |
          echo "========================================"
          echo "HOST PYTHON"
          echo "========================================"
          python --version

          echo ""
          echo "========================================"
          echo "JAVA"
          echo "========================================"
          java -version

          echo ""
          echo "========================================"
          echo "P4A CONFIGURADO"
          echo "========================================"
          grep "^p4a.branch" buildozer.spec || true

          echo ""
          echo "========================================"
          echo "REQUIREMENTS"
          echo "========================================"
          grep "^requirements" buildozer.spec || true

          echo ""
          echo "========================================"
          echo "ANDROID API"
          echo "========================================"
          grep "^android.api" buildozer.spec || true

          echo ""
          echo "========================================"
          echo "ANDROID MIN API"
          echo "========================================"
          grep "^android.minapi" buildozer.spec || true

          echo ""
          echo "========================================"
          echo "ANDROID NDK"
          echo "========================================"
          grep "^android.ndk" buildozer.spec || true

          echo ""
          echo "========================================"
          echo "ML KIT"
          echo "========================================"
          grep "^android.gradle_dependencies" buildozer.spec || true

      # ==========================================================
      # BUILD APK
      # ==========================================================
      - name: Build APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
          URL_freetype: "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz"
        run: |
          echo "========================================"
          echo "INICIANDO BUILD ANDROID"
          echo "========================================"
          echo "FREETYPE MIRROR:"
          echo "$URL_freetype"
          echo "========================================"
          buildozer -v android debug

      # ==========================================================
      # VERIFICAR APK
      # ==========================================================
      - name: Conferir APK gerado
        run: |
          echo "========================================"
          echo "APK GERADO"
          echo "========================================"

          find bin -maxdepth 1 -type f -name "*.apk" -print
          APK_COUNT=$(find bin -maxdepth 1 -type f -name "*.apk" | wc -l)

          echo ""
          echo "Total de APKs encontrados: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERRO: Nenhum APK foi encontrado."
            exit 1
          fi

          echo "========================================"
          echo "BUILD FINALIZADO COM SUCESSO"
          echo "========================================"

      # ==========================================================
      # UPLOAD DO APK
      # ==========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nr17-visao-apk
          path: bin/*.apk
          if-no-files-found: error
